:root{
  /* warna — disampling dari gambar desain */
  --navy:#1C2266;
  --navy-logo:#17146B;
  --blue:#1A61F9;
  --muted:#6B6B7E;
  --pill-a:#4F80FC;
  --pill-b:#3D4CDF;
  --pill-c:#7A52ED;
  --band:#FBF4FE;

  /* 1u = 1 piksel gambar desain (1536 × 1024).
     Skala diambil dari sisi layar yang lebih sempit (lebar ATAU tinggi),
     jadi seluruh komposisi selalu muat — tidak ada yang terpotong di layar
     lebar-pendek (mis. 1920 × 910 karena tab, bookmark, dan taskbar).
     Dibatasi 1.1px supaya tidak raksasa di monitor besar. */
  --u:min(calc(100vw / 1536), calc(100dvh / 1024), 1.1px);
  --canvas-h:calc(1024 * var(--u));
  --photo-w:calc(1536 * var(--u));
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--navy);background:var(--band);
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
img{display:block}
a{color:inherit;text-decoration:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* ---------- panggung & kanvas ----------------------------------- */
.stage{
  position:relative;height:100vh;height:100dvh;overflow:hidden;
  background:linear-gradient(90deg,#FDF4FE 0%,#F4ECFE 55%,#F7F1FD 100%);
}
/* Kanvas menempel di bawah layar. Teks dihitung dari tepi kiri layar,
   foto menempel di kanan. Layar lebih lebar dari 3:2 → sisa ruang di kiri
   diisi warna latar dan tepi kiri foto dipudarkan; layar lebih tegak → sisa
   ruang di atas, tepi atas foto dipudarkan. */
.canvas{position:absolute;left:0;bottom:0;width:100vw;height:var(--canvas-h)}
.photo{
  position:absolute;right:0;top:0;width:var(--photo-w);height:100%;
  --fade-x:min(calc((100vw - var(--photo-w)) * .9), calc(var(--photo-w) * .28));
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 var(--fade-x)),linear-gradient(to bottom,transparent 0,#000 5%);
  -webkit-mask-composite:source-in;
          mask-image:linear-gradient(to right,transparent 0,#000 var(--fade-x)),linear-gradient(to bottom,transparent 0,#000 5%);
          mask-composite:intersect;
  user-select:none;pointer-events:none;
}

/* ---------- merek ------------------------------------------------ */
.brand{
  position:absolute;left:calc(97 * var(--u));top:calc(75 * var(--u));
  display:flex;align-items:center;gap:calc(23 * var(--u));
}
.brand img{width:calc(94 * var(--u));height:auto}
.brand-name{
  display:block;font-size:calc(42.5 * var(--u));font-weight:800;
  color:var(--navy-logo);letter-spacing:-.005em;line-height:1;
}
.brand-tag{
  display:block;font-size:calc(21.5 * var(--u));font-weight:600;
  color:var(--muted);letter-spacing:.06em;line-height:1;margin-top:calc(8 * var(--u));
}

/* ---------- judul ------------------------------------------------ */
h1{
  position:absolute;left:calc(106 * var(--u));top:calc(258 * var(--u));margin:0;
  font-size:calc(68.8 * var(--u));font-weight:750;line-height:calc(74 * var(--u));
  letter-spacing:-.012em;color:var(--navy);
}
h1 span{display:block;white-space:nowrap}
h1 .accent{color:var(--blue)}

/* ---------- tombol Instagram ------------------------------------ */
.ig{
  position:absolute;left:calc(105 * var(--u));top:calc(561 * var(--u));
  width:calc(561 * var(--u));height:calc(121 * var(--u));border-radius:999px;
  display:flex;align-items:center;color:#fff;
  background:
    linear-gradient(180deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 45%,rgba(20,20,90,.14) 100%),
    linear-gradient(90deg,var(--pill-a) 0%,var(--pill-b) 42%,var(--pill-c) 100%);
  box-shadow:0 calc(14 * var(--u)) calc(30 * var(--u)) rgba(70,60,200,.22);
  transition:transform .2s ease,box-shadow .2s ease,filter .2s ease;
}
.ig:hover{transform:translateY(-2px);filter:brightness(1.05);box-shadow:0 calc(18 * var(--u)) calc(36 * var(--u)) rgba(70,60,200,.3)}
.ig:focus-visible{outline:3px solid #fff;outline-offset:3px;box-shadow:0 0 0 6px var(--pill-b)}
.ig img{
  width:calc(83 * var(--u));height:calc(83 * var(--u));margin-left:calc(48 * var(--u));
  border-radius:calc(21 * var(--u));
}
.ig .sep{
  width:max(1px,calc(2 * var(--u)));height:calc(71 * var(--u));margin:0 calc(33 * var(--u)) 0 calc(27 * var(--u));
  background:rgba(255,255,255,.7);border-radius:2px;
}
.ig-text{display:flex;flex-direction:column}
.ig-text small{font-size:calc(29 * var(--u));font-weight:500;line-height:1.15}
.ig-text b{font-size:calc(42.5 * var(--u));font-weight:700;line-height:1.15;letter-spacing:-.005em}

/* ---------- HP & layar tegak --------------------------------------
   Satu layar penuh tanpa scroll: logo → judul → tombol Instagram di atas,
   foto mengisi seluruh sisa tinggi. Ukuran teks dihitung dari lebar layar
   supaya "treatment kesehatanmu" tetap satu baris seperti desain
   (lebar baris itu ≈ 11,9 × ukuran font). */
@media (max-width:760px),(max-aspect-ratio:9/10){
  :root{
    --pad:clamp(20px,6vw,56px);
    --h1:clamp(23px,calc((100vw - 2 * var(--pad)) / 11.9),58px);
  }
  body{overflow:auto}
  .stage{
    height:auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#FCF4FE 0%,#F6EEFE 45%,#EEE4FD 100%);
  }
  .canvas{
    position:static;width:auto;height:auto;flex:1;display:flex;flex-direction:column;
    padding:max(clamp(20px,4.5vh,48px),env(safe-area-inset-top)) var(--pad) 0;
  }
  .brand,h1,.ig{position:static}
  .brand{gap:calc(var(--h1) * .36)}
  .brand img{width:calc(var(--h1) * 1.6)}
  .brand-name{font-size:calc(var(--h1) * .78)}
  .brand-tag{font-size:calc(var(--h1) * .42);margin-top:calc(var(--h1) * .14)}
  h1{
    margin-top:clamp(24px,6vh,64px);
    font-size:var(--h1);line-height:1.1;letter-spacing:-.015em;
  }
  .ig{
    margin-top:clamp(20px,3.6vh,40px);align-self:flex-start;
    width:auto;height:auto;padding:calc(var(--h1) * .34) calc(var(--h1) * 1.1) calc(var(--h1) * .34) calc(var(--h1) * .42);
    box-shadow:0 10px 24px rgba(70,60,200,.22);
  }
  .ig img{width:calc(var(--h1) * 1.55);height:calc(var(--h1) * 1.55);margin-left:0;border-radius:calc(var(--h1) * .4)}
  .ig .sep{width:1.5px;height:calc(var(--h1) * 1.3);margin:0 calc(var(--h1) * .5)}
  .ig-text small{font-size:max(13px,calc(var(--h1) * .44))}
  .ig-text b{font-size:max(18px,calc(var(--h1) * .64))}
  .photo{
    order:3;position:static;flex:1 1 0;min-height:clamp(220px,38vh,520px);
    width:calc(100% + 2 * var(--pad));height:auto;margin:clamp(8px,2vh,24px) calc(-1 * var(--pad)) 0;
    object-fit:cover;object-position:88% 62%;
    padding-bottom:env(safe-area-inset-bottom);
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22%);
            mask-image:linear-gradient(to bottom,transparent 0,#000 22%);
    -webkit-mask-composite:source-over;mask-composite:add;
  }
}
/* layar sangat pendek (HP kecil): rapatkan jarak */
@media (max-width:760px) and (max-height:600px){
  h1{margin-top:20px}
  .ig{margin-top:16px}
}
@media (prefers-reduced-motion:reduce){.ig{transition:none}}
</style>
</head>
<body>
